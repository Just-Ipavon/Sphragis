[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sphragis"
version = "1.0.0"
description = "Cryptographic clone-detection engine for NXP NTAG 424 DNA (SUN/SDM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Pasquale Ruotolo" }]
keywords = ["nfc", "ntag424", "sdm", "sun", "aes-cmac", "anti-counterfeiting",
            "clone-detection", "cryptography", "security"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
dependencies = ["pycryptodome>=3.20"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Reader transport for tools/ on a hardware host (Chameleon Ultra serial
# serial link). The core engine never imports these.
hw = ["pyserial>=3.5"]
# Postgres backends (counter floor, detector history, alert audit) for
# multi-host deployments; see docs/production.md.
pg = ["psycopg[binary]>=3.1"]
# pycose is an independent COSE implementation the signed-event tests check
# against; pycose 1.1 does not read cbor2 6 output, hence the cap.
test = ["pytest>=7", "httpx>=0.27", "pycose>=1.1", "cbor2>=5.6,<6"]

[project.urls]
Homepage = "https://github.com/Just-Ipavon/Sphragis"
Documentation = "https://github.com/Just-Ipavon/Sphragis/tree/main/docs"
Changelog = "https://github.com/Just-Ipavon/Sphragis/blob/main/CHANGELOG.md"
Security = "https://github.com/Just-Ipavon/Sphragis/blob/main/SECURITY.md"

[project.scripts]
sphragis = "sphragis.cli:main"

[tool.setuptools]
packages = ["sphragis", "sphragis.api", "sphragis.transport"]

[tool.bandit]
# B413 flags every `Crypto` import because PyCrypto and pycryptodome share the
# namespace. The engine requires pycryptodome and refuses PyCrypto at import
# time (sphragis/_cryptocheck.py), so the finding does not apply.
skips = ["B413"]
