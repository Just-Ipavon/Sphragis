name: Security

# Known-vulnerability scan of the locked dependencies and a static scan of the
# code, on every change and weekly (new advisories appear without a commit).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the scanners (locked, hash-checked)
        run: pip install --require-hashes -r requirements/security.lock
      - name: pip-audit (locked dependencies)
        run: pip-audit --require-hashes --disable-pip -r requirements/ci.lock
      - name: bandit (medium severity and up)
        run: bandit -c pyproject.toml -r sphragis tools -ll -ii
      - name: ruff (correctness rules in pyproject.toml)
        run: ruff check sphragis tools tests examples
