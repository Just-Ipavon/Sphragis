name: Security

# Known-vulnerability scan of the locked dependencies and a static scan of the
# code, on every change and weekly (new advisories appear without a commit).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the scanners
        run: pip install pip-audit bandit
      - name: pip-audit (locked dependencies)
        run: pip-audit --require-hashes --disable-pip -r requirements/ci.lock
      - name: bandit (medium severity and up)
        run: bandit -c pyproject.toml -r sphragis tools -ll -ii
