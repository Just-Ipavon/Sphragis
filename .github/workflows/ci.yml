name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (locked, hash-checked)
        run: |
          pip install --require-hashes -r requirements/ci.lock
          pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest -q

  postgres:
    # The storage backends against a real Postgres: conformance + concurrency.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sphragis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPHRAGIS_TEST_PG_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=sphragis_test"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (locked, hash-checked)
        run: |
          pip install --require-hashes -r requirements/ci.lock
          pip install --no-deps -e .
      - name: Run tests (Postgres backends enabled)
        run: python -m pytest -q
